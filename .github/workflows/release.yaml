name: Release

# Push a tag vYYYY.MM.N (N counts up from 1 within the month) to build the
# packages, attach them to a GitHub release of that tag, and add them to the
# APT repository in the release apt-trixie.
#
# Needs the secrets APT_GPG_PRIVATE_KEY (armored private key) and
# APT_GPG_PASSPHRASE (empty when the key has no passphrase).

on:
  push:
    tags: ['v*']

# Two runs must not update the APT repository at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Tag is vYYYY.MM.N
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]{4}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vYYYY.MM.N"
            exit 1
          fi

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yaml

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the submodules
        run: git submodule update --init --depth 1

      - uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          path: debs

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z $APT_GPG_PRIVATE_KEY ]]; then
            echo "::error::secret APT_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          gpg --batch --import <<<"$APT_GPG_PRIVATE_KEY"
          echo "APT_GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')" >>"$GITHUB_ENV"

      - name: GitHub release
        run: |
          scripts/release-notes.sh debs/*/*.deb >notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md debs/*/*.deb

      - name: APT repository
        env:
          APT_SUITE: trixie
          APT_KEEP: 5
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/publish-apt.sh debs/*/*.deb

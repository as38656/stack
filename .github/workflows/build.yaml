name: Build (reusable)

# Build the packages of each component and test them together. A component is
# rebuilt only when its commit or its build files change; otherwise the
# packages come from the cache.

on:
  workflow_call:

env:
  OUT: out/trixie

jobs:
  vpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      # Full history: the package version comes from `git describe`, and
      # vpp-ext-deps counts commits since the release candidate tag.
      - name: Fetch the vpp submodule
        run: git submodule update --init vpp

      - name: Cache keys
        id: key
        run: |
          echo "debs=vpp-debs-trixie-$(scripts/component-commit.sh vpp)-${{ hashFiles('Makefile', 'build/builder.Dockerfile', 'build/lib.sh', 'build/vpp.sh') }}" >>"$GITHUB_OUTPUT"
          echo "ext-deps=vpp-ext-deps-trixie-$(git -C vpp rev-parse HEAD:build/external)" >>"$GITHUB_OUTPUT"

      - name: Cached packages
        id: debs
        uses: actions/cache@v4
        with:
          path: ${{ env.OUT }}/vpp
          key: ${{ steps.key.outputs.debs }}

      - name: Cached vpp-ext-deps
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/vpp-ext-deps
          key: ${{ steps.key.outputs.ext-deps }}

      - name: Free disk space
        if: steps.debs.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        if: steps.debs.outputs.cache-hit != 'true'
        run: make vpp CACHE="$PWD/.cache"

      - uses: actions/upload-artifact@v7
        with:
          name: debs-vpp
          path: ${{ env.OUT }}/vpp/*.deb
          if-no-files-found: error

  vpp-etherip:
    needs: vpp
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Full history of vpp-etherip: the package version counts the commits.
      - name: Fetch the submodules
        run: |
          git submodule update --init --depth 1 vpp
          git submodule update --init vpp-etherip

      # The plugin is built against one vpp, so the vpp commit is in the key.
      - name: Cache key
        id: key
        run: |
          echo "debs=vpp-etherip-debs-trixie-$(scripts/component-commit.sh vpp-etherip)-$(scripts/component-commit.sh vpp)-${{ hashFiles('Makefile', 'build/builder.Dockerfile', 'build/lib.sh', 'build/vpp-etherip.sh') }}" >>"$GITHUB_OUTPUT"

      - name: Cached packages
        id: debs
        uses: actions/cache@v4
        with:
          path: ${{ env.OUT }}/vpp-etherip
          key: ${{ steps.key.outputs.debs }}

      - uses: actions/download-artifact@v8
        if: steps.debs.outputs.cache-hit != 'true'
        with:
          name: debs-vpp
          path: ${{ env.OUT }}/vpp

      - name: Build
        if: steps.debs.outputs.cache-hit != 'true'
        run: make vpp-etherip CACHE="$PWD/.cache"

      - uses: actions/upload-artifact@v7
        with:
          name: debs-vpp-etherip
          path: ${{ env.OUT }}/vpp-etherip/*.deb
          if-no-files-found: error

  smoke:
    needs: [vpp, vpp-etherip]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the submodules
        run: git submodule update --init --depth 1

      - uses: actions/download-artifact@v8
        with:
          name: debs-vpp
          path: ${{ env.OUT }}/vpp

      - uses: actions/download-artifact@v8
        with:
          name: debs-vpp-etherip
          path: ${{ env.OUT }}/vpp-etherip

      - name: Smoke test
        run: make smoke
